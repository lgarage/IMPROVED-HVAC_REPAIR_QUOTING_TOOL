# Deploys the whole static site (dispatcher + technician app) to Firebase Hosting on push to main.
#
# One-time GitHub setup:
# 1. Firebase Console → Project settings → Service accounts → Generate new private key (JSON).
# 2. Repo → Settings → Secrets and variables → Actions → New repository secret.
#    Name:  FIREBASE_SERVICE_ACCOUNT_JSON
#    Value: paste the entire JSON file contents (single line is fine).
#
# Field app URL after deploy: https://vertex-core-db.web.app/technician/index.html
# (Authorized domains for Auth / OAuth are managed in Firebase Console → Authentication → Settings.)

name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: vertex-core-db
          channelId: live
